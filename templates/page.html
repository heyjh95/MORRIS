<!doctype html>
<!-- 자동 생성: templates/와 data/를 수정한 다음 npm run build:html을 실행하세요. -->
<html lang="{{language}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{title}}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="../scss/_reset.css" />
    <link rel="stylesheet" href="../css/layout.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;icon_names=favorite,home,search,settings,arrow_outward,arrow_forward_ios,arrow_back_ios" />
    <script src="../js/main.js" defer></script>
    <meta name="description" content="{{description}}" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="{{ogLocale}}" />
    <meta property="og:site_name" content="MORIS" />
    <meta property="og:title" content="{{ogTitle}}" />
    <meta property="og:description" content="{{ogDescription}}" />
    <meta property="og:url" content="https://heyjh95.github.io/Moris/" />
    <meta property="og:image" content="https://heyjh95.github.io/Moris/images/og/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{twitterTitle}}" />
    <meta name="twitter:description" content="{{twitterDescription}}" />
    <meta name="twitter:image" content="https://heyjh95.github.io/Moris/images/og/og.png" />
  </head>
  <body>
{{{header}}}
    <main>
{{{hero}}}
      <section class="floating">
        <button class="floating__close" type="button" aria-label="{{closePopup}}">
          <img src="../images/common/floating_close.svg" alt="" />
        </button>
        <div class="floating__popup">
          <img class="floating__logo" src="../images/common/floating_logo.svg" alt="MORIS" />
          <div class="floating__links">
            <a href="#" class="floating__store">
              <span>{{{storeLines}}}</span><span aria-hidden="true">↗</span>
            </a>
            <a href="#" class="floating__inquiry">
              <span>{{inquiry}}</span><span class="floating__arrow" aria-hidden="true">↗</span>
            </a>
          </div>
        </div>
      </section>
{{{newProducts}}}
      <section class="brand-message">
        <div class="brand-message__heading">
          <span class="brand-message__line" aria-hidden="true"></span>
          <h2 class="brand-message__title">{{messageHeading}}</h2>
        </div>
        <p class="brand-message__description">{{messageDescription}}</p>
      </section>
{{{categories}}}
{{{brands}}}
    </main>
  </body>
</html>
