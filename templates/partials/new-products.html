      <section class="new-products" id="products">
        <div class="new-products__heading">
          <h2 class="new-products__title">NEW PRODUCT</h2>
          <p class="new-products__description">{{{description}}}</p>
        </div>
        <a href="#" class="new-products__all-link">{{allProducts}}<span class="material-symbols-outlined new-products__all-icon" aria-hidden="true">arrow_outward</span></a>
        <div class="new-products__slider swiper">
          <ul class="swiper-wrapper">
{{{cards}}}
          </ul>
          <div class="new-products__controls">
            <div class="swiper-scrollbar new-products__scrollbar"></div>
            <div class="new-products__navigation">
              <button type="button" class="new-products__nav-button new-products__prev" aria-label="{{previousProduct}}">
                <span class="material-symbols-outlined new-products__nav-icon" aria-hidden="true">arrow_back_ios</span>
              </button>
              <button type="button" class="new-products__nav-button new-products__next" aria-label="{{nextProduct}}">
                <span class="material-symbols-outlined new-products__nav-icon" aria-hidden="true">arrow_forward_ios</span>
              </button>
            </div>
          </div>
        </div>
      </section>
