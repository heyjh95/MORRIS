          <div class="swiper-pagination-bullet{{activeClass}}">
            <button class="main-visual__select" type="button" aria-label="{{label}}" aria-current="{{current}}"></button>
            <div class="main-visual__card-content">
              <span class="main-visual__card-no">{{id}}</span>
              <p class="main-visual__card-title">{{title}}</p>
              <div class="main-visual__card-detail">
                <p class="main-visual__card-description">{{description}}</p>
                <a class="main-visual__card-link" href="#">Find out more</a>
              </div>
            </div>
          </div>
