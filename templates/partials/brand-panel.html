            <article class="brands__panel brands__panel--{{id}}">
              <div class="brands__visual"><img class="brands__image" src="{{image}}" alt="{{imageAlt}}" {{{loading}}} /></div>
              <div class="brands__content">
                <div class="brands__brand">
                  <h3 class="brands__brand-name">{{name}}</h3>
                  <img class="brands__brand-logo" src="{{logo}}" alt="" />
                </div>
                <div class="brands__info">
                  <h4 class="brands__tagline">{{tagline}}</h4>
                  <p class="brands__description">{{description}}</p>
                  <a href="#" class="brands__link">{{viewAll}}<span class="material-symbols-outlined" aria-hidden="true">arrow_outward</span></a>
                </div>
              </div>
            </article>
