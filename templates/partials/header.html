    <header class="header" data-open-label="{{openMenu}}" data-close-label="{{closeMenu}}">
      <h1 class="header__logo">
        <a class="header__home" href="{{home}}">
          <img class="header__logo-image" src="../images/common/logo1.png" alt="MORIS" />
        </a>
      </h1>
      <nav class="gnb" aria-label="{{navigation}}">
        <ul class="gnb__list">
{{{primaryMenu}}}
        </ul>
      </nav>
      <div class="header__actions">
        <details class="header__language">
          <summary class="header__language-toggle" aria-label="{{language}}">{{languageCode}} <span aria-hidden="true">⌄</span></summary>
          <div class="header__language-menu">
            <a class="header__language-link" href="./index.html" {{{koreanCurrent}}}>한국어</a>
            <a class="header__language-link" href="./en.html" {{{englishCurrent}}}>English</a>
          </div>
        </details>
        <button class="header__menu-toggle" type="button" aria-label="{{openMenu}}" aria-expanded="false" aria-controls="site-drawer">
          <span class="header__menu-line"></span><span class="header__menu-line"></span><span class="header__menu-line"></span>
        </button>
      </div>
      <nav id="site-drawer" class="header__drawer" aria-label="{{drawer}}" hidden>
        <ul class="header__drawer-list">
{{{drawerMenu}}}
        </ul>
        <div class="header__drawer-media" aria-hidden="true"></div>
      </nav>
    </header>
