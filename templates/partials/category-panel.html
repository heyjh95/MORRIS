            <section class="product-categories__panel" id="panel-{{id}}" aria-labelledby="heading-{{id}}" {{{hidden}}}>
              <div class="product-categories__info">
                <h3 class="product-categories__heading" id="heading-{{id}}">{{title}}</h3>
                <p class="product-categories__description">{{description}}</p>
                <a class="product-categories__link" href="#" aria-label="{{linkLabel}}">All product<span class="material-symbols-outlined product-categories__link-icon" aria-hidden="true">arrow_outward</span></a>
              </div>
              <div class="product-categories__visual"><img class="product-categories__image" src="{{image}}" alt="{{imageAlt}}" /></div>
            </section>
